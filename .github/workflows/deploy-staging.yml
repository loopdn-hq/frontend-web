name: Deploy Staging

# Builds the static export and copies out/ to S3, then invalidates CloudFront.
# No Docker and no Terraform: the deployable artifact is a folder of files.
on:
  workflow_run:
    workflows: [CI]
    branches: [staging]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_dispatch has no workflow_run payload, so allow it through too.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Build and publish to S3
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.loopdn.com

    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NEXT_PUBLIC_* is inlined at build time, so it has to be set here rather
      # than at runtime - a static bundle has no runtime to read it from.
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_WS_HOST: ${{ vars.NEXT_PUBLIC_WS_HOST }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Keep every build addressable by commit, so a rollback is a copy rather
      # than a rebuild of an older tree.
      - name: Archive this version
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          aws s3 sync out/ "s3://${{ vars.S3_BUCKET }}-releases/$sha/" --only-show-errors

      # Two passes on purpose. Filenames under _next/static are content-hashed,
      # so they can be cached forever; the HTML that points at them must never
      # be, or browsers keep loading the previous build's asset names.
      - name: Publish hashed assets
        run: |
          aws s3 sync out/ "s3://${{ vars.S3_BUCKET }}" --delete --only-show-errors \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Publish HTML
        run: |
          aws s3 sync out/ "s3://${{ vars.S3_BUCKET }}" --delete --only-show-errors \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" --id "$id"
          echo "Live at https://staging.loopdn.com"
